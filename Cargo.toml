[package]
name = "llm-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An OpenAI-compatible gateway in front of several LLM providers, with fallback, circuit breakers, rate limits, spend budgets and a response cache"
license = "MIT"
authors = ["Paul Davis"]
readme = "README.md"
keywords = ["llm", "gateway", "openai", "anthropic", "proxy"]
categories = ["web-programming::http-server"]

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.8"
bytes = "=1.11.1"
clap = { version = "=4.5.58", features = ["derive", "env"] }
futures-util = "=0.3.32"
hex = "=0.4.3"
httpdate = "=1.0.3"
lru = "=0.16.3"
prometheus = { version = "=0.14.0", default-features = false }
rand = "=0.9.2"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.49.0", features = ["full"] }
toml = "=0.9.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "json"] }
uuid = { version = "=1.21.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "=1.49.0", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "overhead"
harness = false
